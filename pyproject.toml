[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recordhub"
version = "0.1.0"
description = "Feishu-based team record and analysis infrastructure"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.115,<1",
    "lark-oapi>=1.4,<2",
    "pydantic>=2.9,<3",
    "tzdata>=2024.1",
    "uvicorn>=0.30,<1",
]

[tool.setuptools]
packages = [
    "config",
    "data",
    "schema",
    "workflow1",
    "service",
    "tool",
    "llm",
    "skills",
    "analysis",
]
package-dir = {skills = "src/skills", analysis = "src/analysis", workflow1 = "src/workflow1", service = "service", tool = "tool", llm = "llm"}
py-modules = ["main"]

[project.scripts]
recordhub = "main:main"
